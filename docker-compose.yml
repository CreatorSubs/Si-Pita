services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: si-pita-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "${APP_NAME:-Si-Pita}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:xUFeyRPXF1ASxsvDkyizOefC/RiiIYDpoaBOjNlD5Mw=}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-si_pita}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-rootpassword}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      LOG_CHANNEL: stderr
      OWNER_PASSWORD: "${OWNER_PASSWORD:-adminpassword}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public

  db:
    image: mysql:8.0
    container_name: si-pita-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-rootpassword}"
      MYSQL_DATABASE: "${DB_DATABASE:-si_pita}"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage_data:
  db_data:
